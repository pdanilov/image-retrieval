[project]
name = "cbir"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavel Danilov", email = "pdanilov94@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.2",
    "datasets<4.0",
    "numpy>=2.5.1",
    "opencv-python-headless>=4.10",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.0",
    "torch>=2.7.0",
    "tyro>=1.0.15",
]

[project.scripts]
cbir = "cbir.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
