name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The ViT tests download small checkpoints from Hugging Face; caching them
      # keeps every run from re-fetching ~300 MB and from hitting the Hub's rate limits.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-${{ hashFiles('src/cbir/descriptors/vit/frozen.py') }}
          restore-keys: hf-models-

      - name: Test
        run: uv run pytest
        env:
          # Read-only token for an account that has accepted the DINOv3 license, so the
          # gated-checkpoint tests run. Absent (forks, a missing secret) they skip.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
